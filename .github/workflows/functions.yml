name: Deploy server functions

# Deploys the Supabase Edge Functions (linked banks) when they change.
# Also runs on feature branches so new server code can be tried from a
# pull request preview before merging; functions only add capabilities the
# app opts into, so deploying early doesn't change the live app.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy bank --project-ref ojmtamizbzlzgqkkoopc --no-verify-jwt
          supabase functions deploy bank-webhook --project-ref ojmtamizbzlzgqkkoopc --no-verify-jwt
